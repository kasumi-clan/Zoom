name: Unpack project
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          unzip -q GodlySmoothZoomCamera.zip -d /tmp/p
          rm -rf /tmp/p/GodlySmoothZoomCamera/.github
          cp -r /tmp/p/GodlySmoothZoomCamera/. .
          rm GodlySmoothZoomCamera.zip
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Godly Smooth Zoom Camera Android project"
          git push
